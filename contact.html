<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="page-container">
        <div class="content-container">
            <!-- ===== HEADER ===== -->
            <header>
                <div class="header-container">
                    <div class="logo-container">
                        <img class="logo" src="images/general/rocLogo.png" alt="Logo ROC Nijmegen">
                    </div>
                    <nav>
                        <div>Home</div>
                        <a href="">De Studie</a>
                        <a href="">Contact</a>
                    </nav>
                </div>
                <div class="header-outline"></div>
            </header>
            <main>
                <!-- ===== HERO ===== -->
                <section>
                    <h1>
                        Informatie over de opleiding
                    </h1>
                    <p>
                        Handige informatie om voorbereid te zijn voor de opleiding
                    </p>
                </section>

                <section>
                    <h2>
                        Aanspreekpunten
                    </h2>
                </section>

                <section class="floor-map">
                    <h2>
                        Platteground
                    </h2>
                    <p>
                        Overzicht van de lokalen in het gebouw.
                    </p>
                    <section class="opzet-button">
                        <button data-img="images/contact/kelder.png">
                            Kelder
                        </button>
                        <button data-img="images/contact/begane-grond.png">
                            Begane grond
                        </button>
                        <button data-img="images/contact/verdieping1.png">
                            1e verdieping
                        </button>
                        <button data-img="images/contact/verdieping2.png">
                            2e verdieping
                        </button>
                        <button data-img="images/contact/verdieping3.png">
                            3e verdieping
                        </button>
                        <button data-img="images/contact/verdieping4.png">
                            4e verdieping
                        </button>

                        <img id="floor-map" src="images/contact/kelder.png" alt="">
                        <img id="floor-map" src="images/contact/begane-grond.png" alt="">
                        <img id="floor-map" src="images/contact/verdieping1.png" alt="">
                        <img id="floor-map" src="images/contact/verdieping2.png" alt="">
                        <img id="floor-map" src="images/contact/verdieping3.png" alt="">
                        <img id="floor-map" src="images/contact/verdieping4.png" alt="">

                        <script>
                            const afbeelding = document.getElementById('plattegrond');

                            document.querySelectorAll('.knoppen button').forEach(knop => {
                                knop.addEventListener('click', () => {
                                    afbeelding.src = knop.dataset.img;
                                    afbeelding.alt = 'Plattegrond ' + knop.textContent;
                                });
                            });
                        </script>

                    </section>
                </section>

















            </main>
            <!-- ===== FOOTER ===== -->
            <footer></footer>
        </div>
    </div>
</body>

</html>
