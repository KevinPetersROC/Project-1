<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="page-container">
        <div class="content-container">
            <!-- ===== HEADER ===== -->
            <header>
                <div class="header-container">
                    <div class="logo-container">
                        <img class="logo" src="images/general/rocLogo.png" alt="Logo ROC Nijmegen">
                    </div>
                    <nav>
                        <a href="homepage.html">Home</a>
                        <a href="informatie.html">De Studie</a>
                        <a class="current-page" href="contact.html">Contact</a>
                    </nav>
                </div>
                <div class="header-outline"></div>
            </header>
            <main>
                <!-- ===== HERO ===== -->
                <section>
                    <h1>
                        Contact
                    </h1>
                    <p>

                    </p>
                </section>

                <section>
                    <h2>
                        Aanspreekpunten
                    </h2>
                </section>

                <section class="floor-plan">
                    <h2>
                        Plattegrond - Heyendaalseweg
                    </h2>
                    <p>
                        Overzicht van de lokalen in het gebouw.
                    </p>

                    <input type="radio" name="verdieping" id="kelder">
                    <input type="radio" name="verdieping" id="begane-grond" checked>
                    <input type="radio" name="verdieping" id="v1">
                    <input type="radio" name="verdieping" id="v2">
                    <input type="radio" name="verdieping" id="v3">
                    <input type="radio" name="verdieping" id="v4">

                    <div class="buttons">
                        <label for="kelder">Kelder</label>
                        <label for="begane-grond">Begane grond</label>
                        <label for="v1">1e verdieping</label>
                        <label for="v2">2e verdieping</label>
                        <label for="v3">3e verdieping</label>
                        <label for="v4">4e verdieping</label>
                    </div>

                    <div class="images">
                        <img class="img-kelder" src="images/contact/kelder.png" alt="Kelder">
                        <img class="img-begane-grond" src="images/contact/begane-grond.png" alt="Begane grond">
                        <img class="img-v1" src="images/contact/verdieping1.png" alt="1e verdieping">
                        <img class="img-v2" src="images/contact/verdieping2.png" alt="2e verdieping">
                        <img class="img-v3" src="images/contact/verdieping3.png" alt="3e verdieping">
                        <img class="img-v4" src="images/contact/verdieping4.png" alt="4e verdieping">

            <!-- ===== FOOTER ===== -->
